services:
  - type: web
    name: afraz-cloud
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: afraz-cloud-db
          property: connectionString
      - key: BOOTSTRAP_USER
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false

databases:
  - name: afraz-cloud-db
    databaseName: afraz
    user: afraz
    plan: 0.1c-256mb
